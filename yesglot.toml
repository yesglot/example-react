# https://github.com/yesglot/yesglot.toml
[yesglot]
version = 1

[project]
id = "019e1376-b68b-7045-86b5-9feb87f898cf"
technology = "react/i18next"
tracked_branch = "main"
custom_prompt = """
This is a playful consumer app called Pizza Justifier. Translate it with a witty, overconfident faux-legal tone, as if a mock courtroom is enthusiastically defending someone's right to eat pizza.

Guidelines:
- Prioritize natural, idiomatic language over literal word-for-word translation.
- Preserve the humor, warmth, and theatrical legal framing.
- Keep UI labels short, clear, and punchy.
- Keep product names, pizza names, and brand references recognizable unless a localized form is clearly more natural.
- The longer "justification" texts should read like funny courtroom arguments, not dry technical text.
- Quotes and authority lines should feel memorable and amusing in the target language.
"""

[source_language]
tag = "en"
path = "public/locales/en/translation.json"

